<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FancySkillMarket</title>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5/index.css" rel="stylesheet" />
<style>
:root {
  --bg: #0a0a0c;
  --surface: #121214;
  --surface2: #18181b;
  --brand: #D5E3FE;
  --brand-hover: #BBC7DF;
  --brand-light: rgba(213,227,254,0.12);
  --text: #ffffff;
  --text2: rgba(255,255,255,0.55);
  --text3: rgba(255,255,255,0.35);
  --text4: rgba(255,255,255,0.25);
  --border: rgba(255,255,255,0.06);
  --radius: 16px;
  --radius-sm: 10px;
  --font: 'JetBrains Mono', system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: #fff;
  line-height: 1.6;
  min-height: 100vh;
}
a { color: var(--brand); text-decoration: none; transition: color .15s; }
a:hover { color: var(--brand-hover); }

/* Nav */
.navbar {
  background: rgba(10,10,12,0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.04);
  position: sticky;
  top: 0;
  z-index: 50;
}
.navbar .brand { font-size: 20px; font-weight: 600; color: #fff; letter-spacing: -0.02em; }
.navbar .brand span { color: var(--brand); }

/* Container */
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

/* Cards */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), 0 4px 20px rgba(0,0,0,0.3);
  transition: all .2s;
}
.card:hover {
  box-shadow: inset 0 0 0 1px rgba(255,214,255,0.12), 0 4px 24px rgba(255,214,255,0.05);
}
.card h3 { font-size: 16px; color: #fff; margin-bottom: 6px; font-weight: 600; }
.card .desc { font-size: 13px; color: var(--text3); margin-bottom: 12px; line-height: 1.5; }
.card .meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.card .version {
  display: inline-block; padding: 2px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 600;
  background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5);
}
.card .file-link {
  font-size: 12px; color: var(--text3);
  padding: 4px 12px; border-radius: 999px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
  transition: all .15s;
}
.card .file-link:hover {
  background: var(--brand-light); border-color: transparent; color: var(--brand);
}
.card .install-cmd {
  margin-top: 12px; padding: 10px 14px; border-radius: var(--radius-sm);
  background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-family: var(--mono); font-size: 12px; color: var(--text3);
}
.card .install-cmd span { color: var(--brand); user-select: all; }
.card .copy-btn {
  flex-shrink: 0; cursor: pointer; font-size: 11px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
  padding: 4px 10px; border-radius: 999px; transition: all .15s; color: var(--text3);
}
.card .copy-btn:hover { background: var(--brand-light); border-color: transparent; color: var(--brand); }

/* Grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }

/* Stats */
.stats {
  display: flex; gap: 24px; margin-bottom: 32px;
  padding: 20px 24px; border-radius: var(--radius);
  background: var(--surface);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
}
.stat-item { text-align: center; }
.stat-value { font-size: 28px; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
.stat-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; }

/* Empty */
.empty { text-align: center; padding: 60px 0; color: var(--text3); font-size: 14px; }

/* Loading */
.loading { text-align: center; padding: 60px 0; color: var(--text4); font-size: 13px; }

/* Animations */
@keyframes blurFadeUp {
  from { opacity: 0; filter: blur(20px); transform: translateY(40px); }
  to { opacity: 1; filter: blur(0); transform: translateY(0); }
}
.animate-blur-fade-up { animation: blurFadeUp 0.3s ease-out forwards; opacity: 0; }

/* Responsive */
@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; }
  .stats { flex-direction: column; gap: 16px; }
}
</style>
</head>
<body>

<nav class="navbar" style="display:flex;align-items:center;justify-content:space-between;padding:16px 24px">
  <div class="animate-blur-fade-up" style="animation-delay:0ms">
    <span class="brand">Fancy<span>SkillMarket</span></span>
  </div>
  <div class="animate-blur-fade-up" style="animation-delay:100ms">
    <a href="https://console.fancy.baicaizhale.top" style="font-size:13px;color:var(--text3)">FancyConsole →</a>
  </div>
</nav>

<div class="container" style="padding-top:32px;padding-bottom:64px">
  <div class="animate-blur-fade-up" style="animation-delay:100ms">
    <h1 style="font-size:22px;font-weight:700;letter-spacing:-0.02em;margin-bottom:4px">Minecraft 插件技能库</h1>
    <p style="font-size:13px;color:var(--text3);margin-bottom:24px">为 Fancy AI 提供 Minecraft 插件操作能力</p>
  </div>

  <div class="stats animate-blur-fade-up" style="animation-delay:200ms">
    <div class="stat-item">
      <div class="stat-value" id="totalCount">-</div>
      <div class="stat-label">可用技能</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="fileCount">-</div>
      <div class="stat-label">技能文件</div>
    </div>
  </div>

  <div class="grid animate-blur-fade-up" style="animation-delay:300ms" id="skillGrid">
    <div class="empty loading">加载中…</div>
  </div>
</div>

<script>
function copyInstall(btn, cmd) {
  navigator.clipboard.writeText(cmd).catch(function(){});
  btn.textContent = '已复制';
  setTimeout(function(){ btn.textContent = '复制'; }, 1500);
}

const DESC_MAP = {
  cmi: 'CMI 全能基础插件使用指南，涵盖传送、经济、聊天、领地、礼包等功能',
  coreprotect: 'CoreProtect 方块日志查询与回溯指南',
  essentialsx: 'EssentialsX 基础插件使用指南，涵盖传送、经济、聊天等功能',
  fancyhelper: 'FancyHelper 辅助插件功能指南',
  give: '物品给予指令使用指南',
  'house-builder': '房屋建造技能，支持日式、中世纪、现代、田园四种风格',
  luckperms: 'LuckPerms 权限管理插件使用指南',
  mcmmo: 'McMMO 技能系统插件使用指南',
  multiverse: 'MultiVerse 多世界管理插件使用指南',
  'nbt-format': 'NBT 数据格式解析与操作指南',
  placeholderapi: 'PlaceholderAPI 变量扩展插件使用指南',
  residence: 'Residence 领地插件使用指南',
  vault: 'Vault 经济/权限桥接插件使用指南',
  worldedit: 'WorldEdit 创世神编辑器使用指南',
};

fetch('manifest.json').then(r => r.json()).then(data => {
  const skills = Object.entries(data.skills).sort((a, b) => a[0].localeCompare(b[0]));
  let totalFiles = 0;

  const cards = skills.map(([name, info]) => {
    totalFiles += (info.files || []).length;
    const desc = DESC_MAP[name] || '';
    const files = (info.files || []).map(f =>
      '<a class="file-link" href="' + name + '/' + f + '">' + f + '</a>'
    ).join('');
    const cmd = '/cli skill install ' + name;

    return '<div class="card">' +
      '<div style="display:flex;align-items:start;justify-content:space-between;margin-bottom:8px">' +
        '<h3>' + name + '</h3>' +
        '<span class="version">v' + info.version + '</span>' +
      '</div>' +
      (desc ? '<div class="desc">' + desc + '</div>' : '') +
      '<div class="meta">' + files + '</div>' +
      '<div class="install-cmd"><span>' + cmd + '</span><button class="copy-btn" onclick="copyInstall(this,\'' + cmd + '\')">复制</button></div>' +
    '</div>';
  }).join('');

  document.getElementById('totalCount').textContent = skills.length;
  document.getElementById('fileCount').textContent = totalFiles;
  document.getElementById('skillGrid').innerHTML = cards || '<div class="empty">暂无技能</div>';
}).catch(() => {
  document.getElementById('skillGrid').innerHTML = '<div class="empty">加载失败</div>';
});
</script>
</body>
</html>
