<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FancySkillMarket</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 600px;
    margin: 2rem auto;
    padding: 0 1rem;
    color: #333;
    background: #fff;
  }
  h1 { font-size: 1.4rem; font-weight: 600; }
  p { color: #666; font-size: 0.95rem; }
  code { font-size: 0.9em; background: #f0f0f0; padding: 1px 4px; border-radius: 2px; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #eee; }
  th { font-weight: 600; font-size: 0.85rem; color: #888; }
  td a { color: #06c; text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .ver { color: #999; font-size: 0.88rem; }
</style>
</head>
<body>
<h1>FancySkillMarket</h1>
<p>访问 <code>manifest.json</code> 获取 Skill 列表。</p>

<table>
  <thead><tr><th>名称</th><th>版本</th></tr></thead>
  <tbody id="list"><tr><td colspan="2">加载中…</td></tr></tbody>
</table>

<script>
fetch('manifest.json').then(r=>r.json()).then(d=>{
  let h='';
  Object.keys(d.skills).sort().forEach(k=>{
    h+='<tr><td><a href="'+k+'/skill.md">'+k+'</a></td><td class="ver">'+d.skills[k].version+'</td></tr>';
  });
  list.innerHTML=h;
}).catch(()=>list.innerHTML='<tr><td colspan="2">加载失败</td></tr>');
</script>
</body>
</html>
